include: package:flutter_lints/flutter.yaml

analyzer:
  # Upstream Dart lint conventions are retained in the vendored player. Local
  # transport changes have integration tests; native changes compile in iOS CI.
  exclude:
    - packages/just_audio/**
  errors:
    unawaited_futures: warning

linter:
  rules:
    avoid_print: true
    unawaited_futures: true
