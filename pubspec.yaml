name: mix_player_app
description: YouTube Mix を既存の HTTPS API と連携して再生する Flutter クライアント。
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  cupertino_http: 2.4.0
  just_audio: 0.10.6
  just_audio_background: 0.0.1-beta.17
  audio_session: 0.2.4
  video_player: 2.10.1
  flutter_secure_storage: 10.3.4
  shared_preferences: 2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
