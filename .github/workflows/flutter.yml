name: Flutter checks
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MIX_BUILD_NUMBER: ${{ github.run_number }}
  MIX_APP_REVISION: ${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: bash scripts/build_app.sh web --no-pub --no-web-resources-cdn

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: bash scripts/build_app.sh apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: mix-player-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - run: bash scripts/build_app.sh apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: mix-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
